spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/digital_resume
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
app:
  upload:
    path: uploads
management:
  endpoints:
    web:
      exposure:
        include: health,info
